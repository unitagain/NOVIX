llm:
  default_provider: deepseek
  providers:
    openai:
      api_key: ${OPENAI_API_KEY}
      model: ${OPENAI_MODEL}
      max_tokens: 8000
      temperature: 0.7
    anthropic:
      api_key: ${ANTHROPIC_API_KEY}
      model: ${ANTHROPIC_MODEL}
      max_tokens: 8000
      temperature: 0.7
    deepseek:
      api_key: ${DEEPSEEK_API_KEY}
      model: ${DEEPSEEK_MODEL}
      max_tokens: 8000
      temperature: 0.7
    gemini:
      api_key: ${GEMINI_API_KEY}
      base_url: ${GEMINI_BASE_URL}
      model: ${GEMINI_MODEL}
      max_tokens: 8000
      temperature: 0.7
    custom:
      api_key: ${CUSTOM_API_KEY}
      base_url: ${CUSTOM_BASE_URL}
      model: ${CUSTOM_MODEL_NAME}
      max_tokens: 8000
      temperature: 0.7

# Agent Configuration / Agent 配置
agents:
  archivist:
    provider: openai
    temperature: 0.3
  writer:
    provider: anthropic
    temperature: 0.7
  editor:
    provider: anthropic
    temperature: 0.5

# Context Budget / 上下文预算
context_budget:
  total_tokens: 128000
  system_rules: 0.05
  cards: 0.15
  canon: 0.10
  summaries: 0.20
  current_draft: 0.30
  output_reserve: 0.20
  # 事实距离衰减系数 / Fact distance decay alpha
  # 公式: decay = 1 / (1 + alpha * ln(1 + distance))
  # 越大则远距离事实权重衰减越快，0 表示禁用距离衰减
  fact_distance_alpha: 0.3

# Archivist Configuration / 档案员配置
archivist:
  # 事实检索的章节窗口大小 / Chapter window size for fact retrieval
  fact_chapter_window: 3
  # 摘要章节窗口大小 / Chapter window size for summaries
  summary_chapter_window: 3
  # 最小章节窗口 / Minimum chapter window
  min_chapter_window: 2
  # 最大章节窗口 / Maximum chapter window
  max_chapter_window: 10
  # 场景简报中的最大角色数 / Max characters in scene brief
  max_characters: 5
  # 场景简报中的最大世界观约束数 / Max world constraints in scene brief
  max_world_constraints: 5
  # 每章提取的最大事实数 / Max facts extracted per chapter
  max_facts: 5
  # 事实质量评分权重 / Fact quality scoring weights
  fact_scoring:
    length_divisor: 18        # 长度评分除数 / Length score divisor
    length_cap: 2.0           # 长度评分上限 / Length score cap
    punctuation_bonus: 0.7    # 复合句标点加分 / Punctuation complexity bonus
    numeric_bonus: 0.3        # 含数字加分 / Numeric data bonus
    density_hint_bonus: 0.8   # 密度提示词加分 / Density hint keyword bonus
    simple_relation_penalty: 0.6  # 简单关系惩罚 / Simple relation penalty

# Writer Configuration / 撰稿人配置
writer:
  # 默认目标字数 / Default target word count
  default_target_word_count: 3000
  # 上下文截断上限 / Context truncation limits
  context_limits:
    fact_summary_items: 2       # 事实摘要最多条数 / Max fact summary items
    event_items: 4              # 事件列表最多条数 / Max event items
    query_items: 4              # 查询列表最多条数 / Max query items
    character_cards: 10         # 角色卡上限 / Max character cards
    world_cards: 10             # 世界观卡上限 / Max world cards
    facts: 20                   # 事实上限 / Max facts
    character_states: 20        # 角色状态上限 / Max character states
    unresolved_gaps: 6          # 未解决缺口上限 / Max unresolved gaps

# LLM Gateway Configuration / LLM 网关配置
gateway:
  # 最大重试次数（硬上限 10，防止无限重试） / Max retries (hard cap 10)
  max_retries: 5
  # 指数退避延迟序列（秒） / Exponential backoff delays in seconds
  retry_delays: [1, 2, 4, 8, 16]
  # 最大单次延迟（秒） / Maximum single delay in seconds
  max_retry_delay: 60.0
  request_timeout_seconds: 120
  max_concurrency_per_provider: 4
  min_request_interval_ms: 0
  circuit_failure_threshold: 5
  circuit_cooldown_seconds: 30

# Retrieval Configuration / 检索配置
retrieval:
  rerank_top_k: 16
  # 二阶段重排只允许使用真实 cross-encoder。旧“按 embedding cosine 重排”已被 benchmark 证明会损伤 recall，已移除。
  # 默认关闭：BAAI/bge-reranker-base 约 1.04GB；启用前必须通过跨语料质量/延迟 A/B。
  reranker:
    enabled: false
    backend: onnx_cross_encoder
    model: BAAI/bge-reranker-base
    cache_dir: models/reranker
  # Writer 用工具按需取设定（agentic 即时检索）是默认主路径（能力降级：provider 不支持工具时回退到装配上下文）。
  # agentic 工具循环的最大轮数。
  agentic_max_iterations: 4
  # 支柱 7 · 自适应预算：canon 规模 ≤ 阈值时整体注入全部卡片+事实（免检索/免 agentic 导航），超过才走检索。
  full_canon_max_facts: 80
  full_canon_max_cards: 30
  full_canon_max_tokens: 12000    # Phase 13：数量+token 双门槛，少量超长事实也不会撑爆全注入预算
  # 草稿生成途中把推理模型的真实思考（reasoning_content）流式推到前端（agent_thinking 事件）——默认开。
  # 能力门控：仅对支持 reasoning_content 的流式 provider（如 deepseek-reasoner / 兼容端点）有效，其余自动 no-op。
  stream_thinking: true
  # prompt caching：默认开。能力门控——仅 Anthropic 生效（把 system 提示标记为 ephemeral 可缓存块，降本降延），其余 no-op。
  prompt_caching: true
  # 语义嵌入层：默认主路径（语义 + 词法 RRF 融合 + rerank）。
  # 能力降级：缺 fastembed 库 / 模型未就位时，运行时自动回退到纯词法(BM25)，不报错。
  # 要真正启用语义检索，需安装 requirements-embeddings.txt（fastembed）并让 bge-small-zh 模型就位。
  embeddings:
    enabled: true
    backend: onnx                 # onnx（本地 fastembed/bge-small-zh）| api（走 LLM 网关，Phase 4b）
    model: BAAI/bge-small-zh-v1.5
    cache_dir: models             # 相对 DATA_DIR；桌面端持久化到用户数据目录，避免每次启动重下
  # 混合检索融合（语义 + 词法）：rrf=排名融合，weighted=加权和
  hybrid:
    fusion: rrf
    bm25_weight: 0.5
    vector_weight: 0.5
  # Phase 4: 关系图（GraphRAG-lite），读 canon/relations.jsonl，本地遍历查询
  relations:
    enabled: true

# Governance / 治理配置
governance:
  memory_auto_active:
    enabled: true
    min_confidence: 0.85
    allowed_types: [preference, progress]
    allowed_scopes: [project, chapter]

# 深度思考能力表 / Thinking capability map（对话栏「深度思考」按钮）
# 只覆盖「能用请求参数切换 thinking」的厂商；DeepSeek 等靠换模型的不在此（用户规则：需换模型的不做）。
# 内置默认见 app/llm_gateway/thinking.py；此处可覆盖/扩展——参数/型号会变，改这里即可，无需动代码。
thinking:
  budget_tokens: 8000          # Anthropic 扩展思考 budget（运行时确保 < max_tokens）
  providers:
    anthropic:
      models: [claude-opus-4, claude-sonnet-4, claude-mythos]   # 型号前缀；Haiku 不支持
      param: { type: enabled }                                   # 运行时补 budget_tokens
    openai:
      models: [o1, o3, o4, gpt-5]
      param: { reasoning_effort: high }
    gemini:
      models: [gemini-2.5, gemini-3]
      param: { reasoning_effort: high }
    qwen:
      models: [qwen3, qwen-max, qwen-plus]
      param: { enable_thinking: true }
    glm:
      models: [glm-5, glm-4.7, glm-4.6, glm-4.5, glm-z1]
      param: { thinking: { type: enabled } }
    grok:
      models: [grok-3, grok-4]
      param: { reasoning: { effort: high } }

# Session Configuration / 会话配置
session:
  max_iterations: 5
  max_question_rounds: 2
  max_research_rounds: 5
  auto_save_interval: 60  # seconds / 秒

# Storage Configuration / 存储配置
storage:
  data_dir: ../data
  encoding: utf-8
  # 记忆包历史备份保留数 / Max memory pack history backups per chapter
  max_memory_pack_history: 3
  # 草稿备份保留数 / Max draft previous-version backups
  max_draft_prev_backups: 3

observability:
  # file: local privacy-safe SDK exporter; otlp: OTLP/gRPC collector; none: disable export.
  otel_exporter: file
  slo:
    window_seconds: 300
    targets:
      writer_turn_success_rate: 0.99
      writer_turn_p95_ms: 120000
      queue_oldest_age_seconds: 300
      provider_retry_exhaustion_rate: 0.01
      compact_reject_rate: 0.02
      commit_conflict_rate: 0.01
      dead_letter_count: 0
